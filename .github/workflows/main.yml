name: Build PMWeather Tornado Addon

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build NeoForge mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find or extract Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          # First, look for a Gradle project already checked into the repository.
          PROJECT_FILE="$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' -not -path './.gradle/*' -not -path '*/build/*' \
            -print -quit || true)"

          # If the repository contains only a source ZIP, extract it and locate the project.
          if [ -z "$PROJECT_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' -not -path './.git/*' -print -quit || true)"
            if [ -z "$ZIP_FILE" ]; then
              echo 'ERROR: No build.gradle/build.gradle.kts and no source ZIP found.'
              echo 'Upload the addon source files or a ZIP containing the Gradle project.'
              exit 1
            fi

            mkdir -p .build-source
            unzip -q "$ZIP_FILE" -d .build-source
            PROJECT_FILE="$(find .build-source -type f \( -name build.gradle -o -name build.gradle.kts \) \
              -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit || true)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo 'ERROR: The extracted ZIP does not contain build.gradle or build.gradle.kts.'
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Build mod
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: PMWeather-Tornado-Addon
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
